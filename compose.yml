name: amr-hub

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: amr_hub
      POSTGRES_USER: amr_hub
      POSTGRES_PASSWORD: amr_hub_local
    ports:
      - "55433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amr_hub -d amr_hub"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
